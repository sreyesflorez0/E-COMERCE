# ==============================================================
# AWS SAM Template — Serverless Reporting Service
# ==============================================================
# Define 4 funciones Lambda + API Gateway + EventBridge Schedule
#
# Despliegue en AWS:
#   sam build
#   sam deploy --guided
#
# Prueba local con SAM CLI + Insomnia:
#   1. Levantar las bases de datos (reporting-db y order-db)
#   2. sam build
#   3. sam local start-api --env-vars env.json
#   4. Probar en Insomnia: http://127.0.0.1:3000/reports
#
# Invocar función individual:
#   sam local invoke GenerateReportFunction -e events/generate_report_event.json --env-vars env.json
# ==============================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Serverless Reporting Service para la plataforma e-commerce.
  Genera reportes de ventas y métricas bajo demanda o programados.

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        REPORTING_DB_HOST: !Ref ReportingDbHost
        REPORTING_DB_PORT: !Ref ReportingDbPort
        REPORTING_DB_NAME: !Ref ReportingDbName
        REPORTING_DB_USER: !Ref ReportingDbUser
        REPORTING_DB_PASSWORD: !Ref ReportingDbPassword
        ORDER_DB_HOST: !Ref OrderDbHost
        ORDER_DB_PORT: !Ref OrderDbPort
        ORDER_DB_NAME: !Ref OrderDbName
        ORDER_DB_USER: !Ref OrderDbUser
        ORDER_DB_PASSWORD: !Ref OrderDbPassword
        JWT_SECRET: !Ref JwtSecret
        JWT_ALGORITHM: !Ref JwtAlgorithm

Parameters:
  ReportingDbHost:
    Type: String
    Default: host.docker.internal
  ReportingDbPort:
    Type: String
    Default: '5437'
  ReportingDbName:
    Type: String
    Default: reporting_db
  ReportingDbUser:
    Type: String
    Default: reporting_user
  ReportingDbPassword:
    Type: String
    NoEcho: true
    Default: reporting_pass
  OrderDbHost:
    Type: String
    Default: host.docker.internal
  OrderDbPort:
    Type: String
    Default: '5436'
  OrderDbName:
    Type: String
    Default: order_db
  OrderDbUser:
    Type: String
    Default: order_user
  OrderDbPassword:
    Type: String
    NoEcho: true
    Default: order_pass
  JwtSecret:
    Type: String
    NoEcho: true
    Default: ecommerce-super-secret-jwt-key-change-this-in-production-must-be-256-bits
  JwtAlgorithm:
    Type: String
    Default: HS512

Resources:

  # ======================== API GATEWAY ========================
  ReportingApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ======================== LAMBDA FUNCTIONS ========================

  # POST /reports/generate — Generación manual de reportes (ADMIN)
  GenerateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.generate_report.handler
      CodeUri: .
      Description: Genera un reporte de ventas bajo demanda (requiere ADMIN)
      Events:
        GenerateReport:
          Type: Api
          Properties:
            RestApiId: !Ref ReportingApi
            Path: /reports/generate
            Method: POST

  # Scheduled — Generación automática de reporte diario
  # También expuesto como POST /reports/daily para pruebas locales con Insomnia
  DailyReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.daily_report.handler
      CodeUri: .
      Description: Genera automáticamente un reporte diario (schedule + endpoint manual)
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)
            Description: Genera reporte diario a las 6:00 AM UTC
            Enabled: true
        DailyReportApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReportingApi
            Path: /reports/daily
            Method: POST

  # GET /reports — Listar reportes generados (ADMIN)
  ListReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.list_reports.handler
      CodeUri: .
      Description: Lista reportes generados con paginación
      Events:
        ListReports:
          Type: Api
          Properties:
            RestApiId: !Ref ReportingApi
            Path: /reports
            Method: GET

  # GET /reports/{id} — Detalle de un reporte (ADMIN)
  GetReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.get_report.handler
      CodeUri: .
      Description: Consulta un reporte específico con métricas
      Events:
        GetReport:
          Type: Api
          Properties:
            RestApiId: !Ref ReportingApi
            Path: /reports/{id}
            Method: GET

Outputs:
  ReportingApiUrl:
    Description: URL del API Gateway del Reporting Service
    Value: !Sub "https://${ReportingApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  GenerateReportFunction:
    Description: ARN de la función de generación de reportes
    Value: !GetAtt GenerateReportFunction.Arn
  DailyReportFunction:
    Description: ARN de la función de reporte diario
    Value: !GetAtt DailyReportFunction.Arn
